[project]
name = "seller-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JellyFishJuggler", email = "guptasrijan85@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi >= 0.110.0",
    "uvicorn >=0.30.0",
    "chromadb>=1.5.9",
    "faster-whisper>=1.2.1",
    "httpx>=0.27.2",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-sarvam>=0.1.2",
    "langgraph>=1.2.20",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "sarvamai>=0.1.45",
    "scikit-learn>=1.9.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "websockets>=13.0",
]

[project.scripts]
seller-dashboard = "seller_dashboard:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
