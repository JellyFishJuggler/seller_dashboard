[project]
name = "seller-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JellyFishJuggler", email = "guptasrijan85@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    "langchain>=1.4.9",
    "langchain-ollama>=1.1.0",
